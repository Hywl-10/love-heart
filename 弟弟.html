<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>五一快乐 周欣雨</title>
<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
#title{
  color:#ff6b95;
  font-size:30px;
  margin-bottom:20px;
  letter-spacing:2px;
}
canvas{
  width:460px;
  height:420px;
}
</style>
</head>
<body>

<div id="title">五一快乐 ❤ 周欣雨</div>
<canvas id="c"></canvas>

<script>
const texts = [
"我爱你","I love you","Je t'aime","Te amo","Ich liebe dich",
"Ti amo","사랑해","愛してる","Eu te amo","Я тебя люблю",
"Ana behibi","Volim te","Seni seviyorum","Jag älskar dig",
"Miluji te","Kocham cię","Szeretlek","Rakastan sinua",
"Elsker deg","T'estimo","Is breá liom tú","Mahal kita",
"Aku cinta padamu","ฉันรักเธอ","Tôi yêu bạn","أنا أحبك",
"دوستت دارم","我喜欢你","我中意你","满眼都是你",
"心只有你","余生都是你","满眼星河皆是你"
];

let canvas = document.getElementById("c");
let ctx = canvas.getContext("2d");
let w = canvas.width = 460;
let h = canvas.height = 420;

function heart(t){
  let x = 16 * Math.sin(t)**3;
  let y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  return {
    x: x * 11 + w/2,
    y: y * 11 + h/2
  };
}

let arr = [];
let num = 80;
for(let i=0;i<num;i++){
  arr.push({
    t: Math.PI*2 / num * i,
    speed: 0.006,
    txt: texts[i % texts.length]
  });
}

function run(){
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle = "#ff5588";
  ctx.font = "13px sans-serif";
  for(let p of arr){
    p.t += p.speed;
    if(p.t > Math.PI*2) p.t = 0;
    let pos = heart(p.t);
    ctx.fillText(p.txt, pos.x, pos.y);
  }
  requestAnimationFrame(run);
}
run();
</script>
</body>
</html>
